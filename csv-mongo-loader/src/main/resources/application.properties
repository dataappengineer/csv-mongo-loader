server.port=8080
spring.application.name=csv-mongo-loader
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# ---------------------------------------------------------------------------
# Configurazione dei tipi CSV (override runtime; i valori qui sotto sono i default).
# In K8s si sovrascrivono via env: CSV_TIMEZONE, CSV_DATE_FORMATS, ecc.
# ---------------------------------------------------------------------------
csv.timezone=UTC
csv.date-formats=dd/MM/yyyy,d/M/yyyy,dd/MM/yy,d/M/yy,yyyy-M-d,d-M-yyyy
csv.datetime-formats=dd/MM/yyyy HH:mm:ss,d/M/yyyy H:mm:ss,d/M/yy H:mm:ss,yyyy-M-d H:mm:ss,yyyy-M-d'T'H:mm:ss,yyyy-M-d'T'H:mm:ss'Z'
csv.boolean-true=SI,S,TRUE,1,Y,YES,VRAI,V
csv.boolean-false=NO,N,FALSE,0,FAUX,F

# Campo tecnico timestamp aggiunto a ogni record (uguale per tutti i record dello stesso
# caricamento, per il controllo dei delta). Nome del campo e formato del valore:
#   epoch = long, millisecondi da epoch (default)
#   date  = BSON Date/ISODate (confronti >/< nativi e indicizzabili)
#   iso   = stringa ISO-8601 (es. 2026-07-10T14:30:00Z)
csv.load-timestamp-field=T
csv.load-timestamp-format=epoch
